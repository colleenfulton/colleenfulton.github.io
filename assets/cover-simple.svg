<svg width="1280" height="720" viewBox="0 0 640 360" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="The final portfolio website, filtered by AI workflows" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<style>
.bgr{fill:#ECE8F1} .win{fill:#F5F4F2} .ink{fill:#211E26} .mute{fill:#6F6B70} .tint{fill:#EEECE8} .bar{fill:#E4E1DC} .shd{fill:#211E26}
.ln{stroke:#E6E3DF;stroke-width:1;fill:none}
.sf{font-family:Newsreader,Georgia,"Times New Roman",serif} .sn{font-family:"Instrument Sans",system-ui,-apple-system,"Segoe UI",sans-serif}
@media (prefers-color-scheme: dark){
.bgr{fill:#2B2837} .win{fill:#17161B} .ink{fill:#ECEBF1} .mute{fill:#A3A0AF} .tint{fill:#212027} .bar{fill:#2A2830} .shd{fill:#000} .ln{stroke:#2C2A33}
}
</style>
<defs><clipPath id="w"><rect x="40" y="28" width="560" height="304" rx="10"/></clipPath></defs>
<rect class="bgr" width="640" height="360"/>
<rect class="shd" x="40" y="34" width="560" height="304" rx="10" opacity=".12"/>
<rect class="win" x="40" y="28" width="560" height="304" rx="10"/>
<g clip-path="url(#w)">
<!-- window chrome -->
<line class="ln" x1="40" y1="52" x2="600" y2="52"/>
<circle class="tint" cx="56" cy="40" r="3"/><circle class="tint" cx="66" cy="40" r="3"/><circle class="tint" cx="76" cy="40" r="3"/>
<rect class="tint" x="240" y="33" width="160" height="14" rx="7"/>
<line class="ln" x1="412" y1="52" x2="412" y2="332"/>

<!-- header -->
<text class="sf ink" x="64" y="88" font-size="16">Colleen Fulton</text>
<text class="sn mute" x="64" y="102" font-size="6.5" font-weight="500" letter-spacing="1">PRODUCT DESIGN ENGINEER</text>

<!-- filter chips: only the active one is called out -->
<text class="sn mute" x="64" y="140" font-size="7.5" font-weight="500">All</text>
<text class="sn mute" x="90" y="140" font-size="7.5" font-weight="500">Mechanical</text>
<text class="sn mute" x="144" y="140" font-size="7.5" font-weight="500">Software</text>
<text class="sn mute" x="190" y="140" font-size="7.5" font-weight="500">Design</text>
<rect class="tint" x="228" y="128" width="66" height="16" rx="5"/>
<text class="sn ink" x="261" y="139.5" text-anchor="middle" font-size="7.5" font-weight="500">AI workflows</text>

<!-- experience rows: title + tool, descriptions as quiet bars -->
<line class="ln" x1="64" y1="164" x2="394" y2="164"/>
<text class="sf ink" x="64" y="188" font-size="11">Mechanical Engineer II</text>
<rect class="bar" x="64" y="198" width="150" height="5" rx="2.5"/>
<rect class="bar" x="64" y="208" width="100" height="5" rx="2.5"/>
<rect class="tint" x="336" y="177" width="58" height="16" rx="5"/>
<text class="sn ink" x="365" y="188" text-anchor="middle" font-size="7.5" font-weight="500">Claude</text>

<line class="ln" x1="64" y1="232" x2="394" y2="232"/>
<text class="sf ink" x="64" y="256" font-size="11">UI Designer, Contractor</text>
<rect class="bar" x="64" y="266" width="150" height="5" rx="2.5"/>
<rect class="bar" x="64" y="276" width="100" height="5" rx="2.5"/>
<rect class="tint" x="336" y="245" width="58" height="16" rx="5"/>
<text class="sn ink" x="365" y="256" text-anchor="middle" font-size="7.5" font-weight="500">Cursor</text>

<!-- projects rail: titles only -->
<text class="sf ink" x="428" y="84" font-size="11">Projects</text>
<line class="ln" x1="428" y1="100" x2="428" y2="140"/>
<text class="sf ink" x="438" y="114" font-size="8.5">Network graph</text>
<rect class="bar" x="438" y="123" width="110" height="5" rx="2.5"/>
<line class="ln" x1="428" y1="156" x2="428" y2="196"/>
<text class="sf ink" x="438" y="170" font-size="8.5">Portfolio workflow</text>
<rect class="bar" x="438" y="179" width="110" height="5" rx="2.5"/>
</g>
<rect class="ln" x="40.5" y="28.5" width="559" height="303" rx="9.5"/>
</svg>
